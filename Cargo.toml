[package]
name = "tradegenius-box"
version = "0.1.0"
edition = "2021"
description = "Box Breakout Scanner & Dashboard rewritten in Rust with PostgreSQL persistence"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
encoding_rs = "0.8"
regex = "1.10"
futures = "0.3"

[profile.release]
opt-level = "z"        # 优先极致优化文件体积
lto = true             # 开启链接时优化 (LTO)
codegen-units = 1      # 单代码生成单元以最大化跨 crate 优化
panic = "abort"        # 发生 panic 时直接 abort，去除无用回溯代码
strip = true           # 剥离所有符号和调试信息

