name: Build and Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            target_name: windows-x86_64
            archive_ext: zip
            binary_name: tradegenius-box.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            target_name: linux-x86_64
            archive_ext: tar.gz
            binary_name: tradegenius-box
          - os: macos-13
            target: x86_64-apple-darwin
            target_name: darwin-x86_64
            archive_ext: tar.gz
            binary_name: tradegenius-box
          - os: macos-latest
            target: aarch64-apple-darwin
            target_name: darwin-arm64
            archive_ext: tar.gz
            binary_name: tradegenius-box

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare package directory
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME:-latest}
          PKG_NAME="tradegenius-box-${VERSION}-${{ matrix.target_name }}"
          mkdir -p "dist/${PKG_NAME}"
          
          # 复制执行程序与静态资源
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${PKG_NAME}/"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${PKG_NAME}/"
            chmod +x "dist/${PKG_NAME}/${{ matrix.binary_name }}"
          fi
          
          [ -f dashboard.html ] && cp dashboard.html "dist/${PKG_NAME}/"
          [ -f .env.example ] && cp .env.example "dist/${PKG_NAME}/"

          cd dist
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
            echo "ARCHIVE_FILE=dist/${PKG_NAME}.zip" >> $GITHUB_ENV
            echo "ARCHIVE_NAME=${PKG_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            echo "ARCHIVE_FILE=dist/${PKG_NAME}.tar.gz" >> $GITHUB_ENV
            echo "ARCHIVE_NAME=${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}
          path: ${{ env.ARCHIVE_FILE }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_FILE }}
          draft: false
          prerelease: false
          generate_release_notes: true
